[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mbf"
version = "0.1.0"
description = "PSX signal provider — data pipeline, signal engine and API"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pdfplumber>=0.11",       # PSX notices: holidays, index recompositions
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ocr = ["rapidocr_onnxruntime>=1.3"]   # scanned PSX notices / report pages

[project.scripts]
mbf = "mbf.cli:main"

[tool.setuptools.packages.find]
include = ["mbf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
